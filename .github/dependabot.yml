version: 2
updates:
  # This project is managed by Bun (bun.lock, no package-lock.json). The `npm`
  # ecosystem cannot update a bun.lockfile, so use the `bun` ecosystem here.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
